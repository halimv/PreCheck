<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Runs</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <h1>precheck</h1>
        <p>Hamilton STARlet · PyLabRobot</p>
        <nav class="nav"><a href="/">Check</a><a class="active" href="/runs">Runs</a><a href="/library">Library</a><a href="/execute">Execute</a></nav>
      </div>
      <section class="panel">
        <h2>Runs</h2>
        <p class="muted" id="runs-note">Every check is saved in this folder's runs/ folder.</p>
        <div id="run-list" class="run-list"></div>
      </section>
    </aside>
    <main class="main">
      <div class="statusbar">
        <span id="status-chip" class="chip idle">Select a run</span>
        <span id="status-text" class="muted">Pick a run on the left to see its summary, provenance and review.</span>
      </div>
      <div id="run-detail"></div>
    </main>
  </div>
  <script src="/static/common.js"></script>
  <script src="/static/runs.js"></script>
</body>
</html>
