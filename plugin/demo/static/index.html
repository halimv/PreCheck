<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>precheck</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <h1>precheck</h1>
        <p>Hamilton STARlet · PyLabRobot</p>
        <nav class="nav"><a class="active" href="/">Check</a><a href="/runs">Runs</a><a href="/library">Library</a><a href="/execute">Execute</a></nav>
      </div>

      <form id="run-form" class="panel">
        <div class="field">
          <span>Protocol
            <button type="button" class="info" data-tip="Describe the protocol in your own words, attach its PDF, or pick one already written as steps. Text and PDFs are turned into steps by Claude, on the deck that is on the STARlet." aria-label="Describe the protocol in your own words, attach its PDF, or pick one already written as steps. Text and PDFs are turned into steps by Claude, on the deck that is on the STARlet.">i</button></span>
          <div class="tabs seg" role="tablist">
            <button type="button" role="tab" id="tab-text" class="active" aria-selected="true">Describe</button>
            <button type="button" role="tab" id="tab-saved" aria-selected="false">Saved</button>
          </div>
          <div id="source-text">
            <textarea id="text" rows="6" placeholder="e.g. Serially dilute the culture 1:10 in 0.9% saline, six times, in a 96-well plate."></textarea>
            <label class="attach"><input type="file" id="file" accept=".pdf,.txt,.md"><span id="file-name">Attach a PDF or text file</span></label>
          </div>
          <div id="source-saved" hidden>
            <select id="protocol"></select>
            <small id="protocol-info" class="hint"></small>
          </div>
        </div>

        <label class="field">
          <span>Repair model
            <button type="button" class="info" data-tip="The model that edits the protocol when a check fails. Claude Haiku is the default: fast, and the edits are small. A local Ollama model keeps everything on this computer." aria-label="The model that edits the protocol when a check fails. Claude Haiku is the default: fast, and the edits are small. A local Ollama model keeps everything on this computer.">i</button></span>
          <select id="model" required></select>
          <small id="model-note" class="note"></small>
        </label>

        <details class="options">
          <summary>Options</summary>
          <label class="field">
            <span>Repair rounds
              <button type="button" class="info" data-tip="How many times the model may try to repair a failing protocol before the run gives up. Nothing unverified is ever accepted." aria-label="How many times the model may try to repair a failing protocol before the run gives up. Nothing unverified is ever accepted.">i</button></span>
            <input id="max-rounds" type="number" min="1" max="10" value="5">
          </label>
          <label class="field">
            <span>Failure report
              <button type="button" class="info" data-tip="What the model is told when a check fails. Lab terms: the failure explained from the knowledge base, with suggested fixes. Raw error: PyLabRobot's exception only." aria-label="What the model is told when a check fails. Lab terms: the failure explained from the knowledge base, with suggested fixes. Raw error: PyLabRobot's exception only.">i</button></span>
            <select id="feedback">
              <option value="translated" selected>In lab terms</option>
              <option value="raw">Raw error</option>
            </select>
          </label>
          <label class="radio"><input id="escalate" type="checkbox" checked> Learn from repeats
            <button type="button" class="info" data-tip="If the same failure comes back, the model is asked to reason past the knowledge base and propose an addition to it. A proposal whose fix worked waits for your approval." aria-label="If the same failure comes back, the model is asked to reason past the knowledge base and propose an addition to it. A proposal whose fix worked waits for your approval.">i</button></label>
        </details>

        <button id="start" type="submit" class="primary">Check protocol</button>
      </form>
    </aside>

    <main class="main">
      <div class="statusbar">
        <span id="status-chip" class="chip idle">Idle</span>
        <span id="status-text" class="muted">Describe a protocol and check it.</span>
        <span id="elapsed" class="elapsed"></span>
      </div>

      <div id="empty" class="empty">
        <h2>From a description to a protocol the STARlet can run</h2>
        <ol class="flow">
          <li data-tip="Claude writes the steps and names the labware each one needs. The labware is then taken from VENUS's library and placed on the deck that is on the instrument."><b>Draft</b></li>
          <li data-tip="The steps are compiled to PyLabRobot and run on a model of this STARlet: its channels, their spacing, the deck, tips and volumes. Nothing is sent to the robot."><b>Check</b></li>
          <li data-tip="When a check fails, the model edits the plan. An edit is kept only if it fixes the failing step without changing how much liquid moves."><b>Repair</b></li>
          <li data-tip="What every well ends up holding and at what dilution, reagent volumes, limits, and suggestions. Watch the assay in 3D, then ask for changes in your own words."><b>Review</b></li>
          <li data-tip="The passing protocol is saved with a standalone script and an AHC layout. Run it from the Execute page, or hand it to AHC for a supervised run."><b>Run</b></li>
        </ol>
      </div>

      <div id="timeline" class="timeline" aria-live="polite"></div>
    </main>
  </div>
  <script src="/static/common.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
